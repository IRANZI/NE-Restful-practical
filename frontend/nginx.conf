# Serve the React single-page application and fall back to index.html.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy REST API calls from the Docker frontend to the internal API gateway.
  location /api/ {
    proxy_pass http://api-gateway:4008/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Proxy Swagger UI through the frontend so no gateway host port is needed.
  location = /api-docs {
    return 301 /api-docs/;
  }

  location /api-docs/ {
    proxy_pass http://api-gateway:4008/api-docs/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
